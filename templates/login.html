<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                      "on-background": "#d5e7fc",
                      "on-secondary-fixed-variant": "#385771",

                      "headline": ["Space Grotesk"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(12, 40, 60, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .floating-object {
            filter: drop-shadow(0 20px 40px rgba(0, 15, 29, 0.4));
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(147, 200, 254, 0.3);
        }
      </style>
</head>
<body class="bg-surface text-on-surface font-body overflow-hidden min-h-screen relative selection:bg-primary/30 selection:text-primary">
<!-- Atmospheric Background Layers -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<!-- Storm Gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-surface via-surface-container-low to-surface-container-highest opacity-80"></div>
<!-- Abstract Atmospheric Glows -->
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[70%] h-[70%] bg-secondary-container/20 rounded-full blur-[140px]"></div>
<!-- 3D Floating Objects (Visual Flourishes) -->
<!-- Object 1: Ethereal Sphere -->
<div class="absolute top-20 left-[15%] w-32 h-32 floating-object">
<img alt="abstract 3d iridescent glass sphere floating in dark space with soft highlights and organic textures" class="w-full h-full object-cover rounded-full mix-blend-screen opacity-60" data-alt="abstract 3d iridescent glass sphere floating in dark space with soft highlights and organic textures" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcaRgWTcA_rUpb9pkC_lzX_iCPOpBB6VDYGCm1_A2ufWqaXTKZh8XkcS3fiwq201lbylokW8o-0Kbi-El-5WPBTOK36f8FfvGBBqHyMgEauuqoj2zVZAIn33Ied9TQ1NM4DfZzInuvKMuTIxiWGGs6VMthtAbn-LFPiSPuQSZp9320EUDBtgjjgtVg1t83Bm1j91dsLfwMFrhQ0xoSFjw9pLtht14fRdCjE4N_TLbRJUVexCQoGaGNyctRrVDh7p97UFU24tXduWig"/>
</div>
<!-- Object 2: Shard Cluster -->
<div class="absolute bottom-40 right-[12%] w-48 h-48 floating-object">
<img alt="crystalline geometric 3D shards reflecting blue and purple light in a dark atmospheric environment" class="w-full h-full object-cover rounded-xl rotate-12 mix-blend-lighten opacity-40" data-alt="crystalline geometric 3D shards reflecting blue and purple light in a dark atmospheric environment" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCipEUUPAC1n6Ic62ftJBbZm-szu2ziNWoOWWVfmhJT5SoVMsqgJr5xHqrJ3QAoS69hT31OQsTvamj8mZo4TkGCm6v3VmlHNkwVCwDgAfzm8yYi1DyGPXE8k5iU9ilZSlF3mW4w76vo511iUMOatQ436FtbaB_SQSeyzPByOagkBr7db_-JoFIzTu7qo15COteqMXZbmXnD_H-Md9UrJ24hyayypm2BT-_OBrBrALeaGCU1CijWn6qnMS8sZ8XYLPOOTffhXJjoGnCo"/>
</div>
<!-- Object 3: Abstract Torus -->
<div class="absolute top-[60%] left-[8%] w-24 h-24 floating-object">
<img alt="ethereal metallic liquid torus ring floating with reflective chrome surface and soft blue glow" class="w-full h-full object-cover rounded-full mix-blend-screen opacity-50" data-alt="ethereal metallic liquid torus ring floating with reflective chrome surface and soft blue glow" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCfl7q6h9KRGHIRxDTyy_qKXEK5YpW5OfqzlropTkXQ90k-KbUnrIHWkTbgvkZdPVX-Ph1wCKzY1X4QtzFZi_311n3jeRRwF7E-dbEEqdRKVHYK2D1hDyk5jCGg8Rqai10NWEuZdUKOwYF5gEYAfnA4Hsz69Oo-831v04MiC2mm9IbZRJq1S0M_riUvPpVT7hC-Uw8zHX1zX5boGV0aMD36UtIet4jWQRQbrvgHmIaHMKokV4MgH9oImAz0f41Yyq0-YdznS2NzIOF9"/>
</div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-6">
<!-- Brand Header -->
<header class="mb-12 text-center">
<h1 class="font-headline text-5xl font-black tracking-tighter text-blue-50 text-glow">ETHEREAL</h1>
<p class="font-label text-sm tracking-[0.4em] uppercase text-slate-400 mt-2">Defined by the Storm</p>
</header>
<!-- Login Card -->
<section class="glass-panel w-full max-w-md p-10 rounded-[2rem] shadow-[0_40px_100px_rgba(0,15,29,0.5)] border border-white/5 relative overflow-hidden">
<!-- Inner card depth texture -->
<div class="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent pointer-events-none"></div>
<div class="relative z-20">
<h2 class="font-headline text-3xl font-bold text-on-surface mb-2">Welcome Back</h2>
<p class="text-on-surface-variant font-body text-sm mb-10">Access your collection in the ethereal horizon.</p>







<form method="post" class="space-y-6">
    {% csrf_token %}
<!-- Email/Username Field -->
<div class="relative group">
<label class="block font-label text-xs uppercase tracking-widest text-slate-400 mb-2 ml-1" for="identifier">Identity</label>
<div class="relative flex items-center">
<div class="absolute left-0 w-[3px] h-0 group-focus-within:h-full bg-primary transition-all duration-500 ease-out rounded-full"></div>
<input id="username" name="username" class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-6 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-0 focus:bg-surface-container transition-colors font-body" id="identifier" placeholder="Artist name or Email" type="text"/>
<span class="material-symbols-outlined absolute right-4 text-outline/40">person</span>
</div>
</div>
<!-- Password Field -->
<div class="relative group">
<div class="flex justify-between items-end mb-2 ml-1">
<label class="block font-label text-xs uppercase tracking-widest text-slate-400" for="password">Keyphrase</label>
<a class="text-[10px] uppercase tracking-tighter text-primary/60 hover:text-primary transition-colors" href="#">Recover Identity?</a>
</div>
<div class="relative flex items-center">
<div class="absolute left-0 w-[3px] h-0 group-focus-within:h-full bg-primary transition-all duration-500 ease-out rounded-full"></div>
<input id="password" name="password" class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-6 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-0 focus:bg-surface-container transition-colors font-body" id="password" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 text-outline/40">lock</span>
</div>
</div>
<!-- CTA Actions -->
<div class="pt-4 space-y-4">
<button class="w-full py-5 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg tracking-tight hover:scale-[1.02] active:scale-95 transition-all duration-300 shadow-[0_15px_30px_rgba(147,200,254,0.2)]" type="submit">
                            Enter the Atmosphere
                        </button>
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-gradient-to-r from-transparent to-outline-variant/30"></div>
<span class="font-label text-[10px] uppercase tracking-widest text-outline/60">or connect via</span>
<div class="h-[1px] flex-1 bg-gradient-to-l from-transparent to-outline-variant/30"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 bg-surface-container-high rounded-xl text-on-surface text-sm font-medium hover:bg-surface-bright transition-all duration-300 border border-white/5" type="button">
<img alt="google" class="w-4 h-4" data-alt="google logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_YH2UcMizKCMEw540xeeirTWBFkl27M5PkuogG1oWvUulAbRMC-cZOlVNT9OmFxS4nyFhfRPfLR4ioL3hressC5dPdDkB9G17t4Sr7Mb6gnDxDTrUtoPpwpqIKkbM5GqFn1BP0GDwxk4uQ_raZMx4acAW10ANsjf8wvFdIWKMMk1u9zN-4gcsD6hJF52IafJvro_ms4jXVn6pz46GSS35dTlnqMtNM0X2L9HSJmKyftSWnezvcKSh4aQz5IxIetJ7xOSSOFZJj7kC"/>
<span class="font-label text-xs uppercase tracking-wider">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 bg-surface-container-high rounded-xl text-on-surface text-sm font-medium hover:bg-surface-bright transition-all duration-300 border border-white/5" type="button">
<span class="material-symbols-outlined text-base">ios</span>
<span class="font-label text-xs uppercase tracking-wider">Apple</span>
</button>
</div>
</div>
</form>
</div>
</section>
<!-- Footer Links (Floating Style) -->
<footer class="mt-12">
<p class="font-label text-[11px] tracking-widest text-slate-500 uppercase">
                New to the vision? 
                <a class="text-blue-300 font-bold ml-2 hover:text-white transition-colors" href="#">Establish Identity</a>
</p>
</footer>
</main>
<!-- Global Layout Decorative Overlay -->
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-surface-container-lowest to-transparent opacity-40 pointer-events-none"></div>
<!-- Interaction Note (Instructional Hidden Meta) -->
<!-- The design implies a slow floating parallax effect for the spheres and a fade-in-up for the login card upon load -->
</body></html>
