{% load static %}
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "inverse-on-surface": "#465767",
                        "primary-fixed": "#93c8fe",
                        "on-error": "#490006",
                        "surface": "#000f1d",
                        "on-secondary-fixed": "#1a3b53",
                        "error-container": "#9f0519",
                        "secondary-fixed": "#bbdbfa",
                        "background": "#000f1d",
                        "on-background": "#d5e7fc",
                        "error-dim": "#d7383b",
                        "tertiary": "#d8eaff",
                        "outline": "#667789",
                        "surface-container-lowest": "#000000",
                        "on-primary-fixed": "#002c4a",
                        "secondary": "#bbdbfa",
                        "tertiary-dim": "#b0cff0",
                        "primary": "#93c8fe",
                        "on-tertiary": "#395874",
                        "secondary-dim": "#adcdeb",
                        "on-secondary-fixed-variant": "#385771",
                        "on-secondary-container": "#b4d4f3",
                        "tertiary-fixed-dim": "#b0cff0",
                        "on-secondary": "#2e4e67",
                        "surface-variant": "#0c283c",
                        "tertiary-container": "#bdddff",
                        "on-tertiary-fixed": "#1b3c57",
                        "on-primary-fixed-variant": "#004a78",
                        "surface-container-highest": "#0c283c",
                        "primary-fixed-dim": "#86bbf0",
                        "on-primary-container": "#00253f",
                        "on-tertiary-container": "#304f6b",
                        "surface-bright": "#112e44",
                        "on-error-container": "#ffa8a3",
                        "tertiary-fixed": "#bdddff",
                        "surface-tint": "#93c8fe",
                        "on-surface-variant": "#9badc0",
                        "on-surface": "#d5e7fc",
                        "on-tertiary-fixed-variant": "#3a5975",
                        "surface-container-high": "#072134",
                        "secondary-fixed-dim": "#adcdeb",
                        "secondary-container": "#2a4a63",
                        "surface-container": "#041b2c",
                        "on-primary": "#00416a",
                        "error": "#ff716c",
                        "surface-dim": "#000f1d",
                        "inverse-surface": "#f7f9ff",
                        "inverse-primary": "#286393",
                        "primary-container": "#70a5d9",
                        "primary-dim": "#86bbf0",
                        "outline-variant": "#394a5a",
                        "surface-container-low": "#011524"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>

    <title>{% block title %}Ethereal Horizon{% endblock %}</title>
    <style>
        /* Fixes the rendering of the Material Icons */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Temporary dark background to make the light-colored navbar visible */
        body {
            background-color: #000f1d; 
            margin: 0;
            padding: 0;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary/30">

    {% block navbar %}
    <nav class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-8 py-3 bg-slate-900/40 backdrop-blur-xl rounded-full mt-6 mx-auto max-w-5xl shadow-[0_40px_60px_-15px_rgba(213,231,252,0.06)]">
        
        <div class="text-2xl font-bold tracking-tighter text-blue-200 font-headline">
            <a href="{% url 'Home' %}">Ethereal Horizon</a>
        </div>
        
        <div class="hidden md:flex items-center space-x-8 font-['Space_Grotesk'] tracking-wider uppercase text-sm">
            <a class="text-slate-400 hover:text-blue-100 transition-colors duration-300" href="#">Gallery</a>
            <a class="text-slate-400 hover:text-blue-100 transition-colors duration-300" href="#">Artists</a>
            <a class="text-slate-400 hover:text-blue-100 transition-colors duration-300" href="#">Auctions</a>
            <a class="text-slate-400 hover:text-blue-100 transition-colors duration-300" href="#">Curations</a>
        </div>
        
        <div class="flex items-center space-x-5">
            <button class="hidden md:block text-slate-400 hover:text-blue-100 transition-colors duration-300 font-['Space_Grotesk'] tracking-wider uppercase text-sm font-semibold mr-2">
                {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}">Sign Out</a>
                {% else %}
                    <a href="{% url 'login' %}">Sign In</a>
                {% endif %} 
            </button>
            <button class="text-blue-300 hover:text-blue-100 transition-colors active:scale-95">
                <span class="material-symbols-outlined">shopping_cart</span>
            </button>
            <button class="text-blue-300 hover:text-blue-100 transition-colors active:scale-95">
                <a href="{% url 'userprofile' %}" class="flex items-center">
                    <span class="material-symbols-outlined">account_circle</span>
                </a>
            </button>
        </div>
        
    </nav>
    {% endblock %}

    {% block content %}
    {% endblock %}

</body>
</html>
